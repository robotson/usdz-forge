name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    # arm64 runners only — the shipped engine is Apple Silicon. Two versions across a
    # major boundary is the whole testable range: macos-14 is being retired (Nov 2026)
    # and there is no hosted arm64 image for macOS 12 or 13, so the floor the app
    # declares (13.0, in Package.swift) is enforced at COMPILE time by the build step
    # below and is not verified at runtime by anyone. Say so in the README.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache engine runtime
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: engine/python
          key: engine-${{ matrix.os }}-${{ hashFiles('engine/setup-engine.sh') }}

      - name: Bootstrap engine (relocatable CPython + OpenUSD)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: ./engine/setup-engine.sh

      - name: Install pytest into engine interpreter
        run: ./engine/python/bin/python3.14 -m pip install --isolated --quiet pytest

      - name: Cache test fixtures (Khronos sample assets)
        uses: actions/cache@v4
        with:
          path: tests/fixtures
          key: fixtures-${{ matrix.os }}-${{ hashFiles('tests/test_conversion.py') }}

      - name: Run regression suite
        run: ./engine/python/bin/python3.14 -m pytest tests -v --tb=short

      # The ARKit checker swallows its exception and reports ERR_CHECKER_CRASH,
      # writing the real traceback to a log nobody collects. Six of these started
      # failing on the runner in Sept 2026 while passing locally and while the code
      # under test was unchanged since July, so print the traceback and the versions
      # it ran against before guessing again.
      - name: Checker traceback and environment (on failure)
        if: failure()
        run: |
          echo "=== macOS / Xcode ==="
          sw_vers; xcodebuild -version 2>/dev/null | head -2
          echo "=== engine interpreter and OpenUSD ==="
          ./engine/python/bin/python3.14 -c 'import sys, pxr; from pxr import Usd; print(sys.version); print("usd", Usd.GetVersion())'
          echo "=== checker log ==="
          cat /tmp/reality-converter-validation.log 2>/dev/null || echo "(no log written)"
          echo "=== direct run, unswallowed ==="
          ./engine/python/bin/python3.14 - <<'PY'
          import glob, traceback
          from pxr import UsdUtils
          target = sorted(glob.glob('tests/output/*_arkit.usdz'))[:1]
          print('checking', target)
          for f in target:
              try:
                  c = UsdUtils.ComplianceChecker(arkit=True, skipARKitRootLayerCheck=False,
                                                 rootPackageOnly=False, skipVariants=False, verbose=False)
                  c.CheckCompliance(f)
                  print('errors:', c.GetErrors())
                  print('failed checks:', c.GetFailedChecks())
              except Exception:
                  traceback.print_exc()
          PY

      - name: Build app (universal)
        run: swift build -c release --arch arm64 --arch x86_64
